t;p&gt;เรียนรู้ด้วยการทำนาย ทดลอง เขียนโปรแกรม และตรวจสอบผลด้วยหลักฐาน&lt;/p&gt;&lt;p&gt;สิ่งที่ใช้: คอมพิวเตอร์ และ C compiler เช่น GCC · พื้นฐาน: อาร์เรย์ ฟังก์ชัน เงื่อนไข และลูป&lt;/p&gt;&lt;p&gt;ผลลัพธ์การเรียนรู้: อธิบายลำดับข้อมูล ติดตามดัชนี พัฒนาโครงสร้างด้วยอาร์เรย์ และจัดการ Overflow/Underflow ได้&lt;/p&gt;&lt;/header&gt;&lt;section id=&quot;worksheet&quot;&gt;&lt;h2&gt;ใบงานสรุป&lt;/h2&gt;&lt;p&gt;คลิกหัวข้อเพื่อดูขั้นตอน ทำเครื่องหมายเมื่อเสร็จ และบันทึกคำตอบ คำตอบเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่ส่งให้อาจารย์อัตโนมัติ&lt;/p&gt;&lt;label&gt;ชื่อ–สกุล / รหัสนักศึกษา / กลุ่มเรียน&lt;input data-save=&quot;student&quot;&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done1&quot;&gt; &lt;a href=&quot;#step1&quot;&gt;1.1 ทำนายก่อนทดลอง&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done2&quot;&gt; &lt;a href=&quot;#step2&quot;&gt;1.2 ติดตามสถานะทีละคำสั่ง&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done3&quot;&gt; &lt;a href=&quot;#step3&quot;&gt;1.3 เขียนโปรแกรม ANSI C&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done4&quot;&gt; &lt;a href=&quot;#step4&quot;&gt;1.4 ทดสอบขอบเขต&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done5&quot;&gt; &lt;a href=&quot;#step5&quot;&gt;1.5 ประยุกต์และสะท้อนผล&lt;/a&gt;&lt;/label&gt;&lt;progress id=&quot;progress&quot; max=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/progress&gt;&lt;span id=&quot;completion&quot;&gt;&lt;/span&gt;&lt;div class=&quot;tools&quot;&gt;&lt;button id=&quot;export&quot;&gt;ดาวน์โหลดคำตอบ (.json)&lt;/button&gt;&lt;button onclick=&quot;window.print()&quot;&gt;พิมพ์ / บันทึก PDF&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;saveStatus&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;step1&quot;&gt;&lt;h2&gt;1.1 ทำนายก่อนทดลอง · 10 นาที&lt;/h2&gt;&lt;p&gt;เปรียบเทียบกองจา ./stack_lab&lt;/pre&gt;&lt;p&gt;บน Windows ใช้ stack_lab.exe แทนคำสั่งรันด้านบน ตัวจำลองในเว็บไม่ได้คอมไพล์หรือตรวจโค้ด C&lt;/p&gt;&lt;label&gt;วางโค้ดที่เติมแล้ว หรือระบุชื่อไฟล์ที่ส่ง&lt;textarea data-save=&quot;code&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;บันทึกผลรันจริงและอธิบายการเปลี่ยนดัชนี&lt;textarea data-save=&quot;output&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;section id=&quot;step4&quot;&gt;&lt;h2&gt;1.4 ทดสอบขอบเขต · 20 นาที&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;เรียกนำออกและ Peek ขณะว่าง สถานะต้องไม่เปลี่ยน&lt;/li&gt;&lt;li&gt;เพิ่มข้อมูลให้ครบ 5 ค่า แล้วเพิ่มครั้งที่ 6 ต้องแจ้ง Overflow&lt;/li&gt;&lt;li&gt;Peek ซ้ำสองครั้ง จำนวนสมาชิกต้องคงเดิม&lt;/li&gt;&lt;li&gt;นำข้อมูลออกจนหมดแล้วเพิ่มใหม่ โครงสร้างต้องกลับมาใช้งานได้&lt;/li&gt;&lt;li&gt;ตรวจว่าข้อมูลที่เพิ่มล่าสุดถูกนำออกก่อนทุกครั้ง&lt;/li&gt;&lt;/ol&gt;&lt;label&gt;บันทึก: กรณีทดสอบ → ผลที่คาด → ผลจริง → ผ่าน/ไม่ผ่าน&lt;textarea data-save=&quot;tests&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;พบข้อผิดพลาดใด? แก้อย่างไร? แนบผลรันก่อนและหลังแก้&lt;textarea data-save=&quot;debug&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;section id=&quot;step5&quot;&gt;&lt;h2&gt;1.5 ประยุกต์และสะท้อนผล · 10 นาที&lt;/h2&gt;&lt;label&gt;ออกแบบ ระบบ Undo: ใช้ Stack เก็บการกระทำอย่างไร และเมื่อ Undo ขณะว่างควรทำอย่างไร?&lt;textarea data-save=&quot;application&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;Push/Pop หรือ Enqueue/Dequeue และ Peek ใช้เวลา Big-O เท่าใด? เหตุใด? พื้นที่ของอาร์เรย์ความจุ N เป็นเท่าใด?&lt;textarea data-save=&quot;complexity&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;เปรียบเทียบ Stack กับ Queue และยกตัวอย่างงานที่ไม่เหมาะกับโครงสร้างในใบงานนี้&lt;textarea data-save=&quot;reflection&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;h3&gt;สิ่งที่ต้องส่ง&lt;/h3&gt;&lt;p&gt;ไฟล์ .c ที่เติมแล้ว ผลทดสอบพร้อมหลักฐาน และคำตอบเป็น JSON หรือ PDF (ส่งผ่านช่องทางที่ผู้สอนกำหนด)&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;เกณฑ์ประเมิน&lt;/th&gt;&lt;th&gt;คะแนน&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ทำนายและติดตามสถานะ&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;โปรแกรมทำงานถูกต้อง&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ทดสอบขอบเขตและอธิบายการแก้ไข&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ประยุกต์และอธิบายความซับซ้อน&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;footer&gt;โครงสร้างกิจกรรมได้รับแรงบันดาลใจจาก &lt;a href=&quot;https://arnans.github.io/iot-training/renders/activity-2.html&quot;&gt;ใบงาน IoT กิจกรรมที่ 2&lt;/a&gt; · เนื้อหาและโค้ดของใบงานนี้จัดทำขึ้นใหม่&lt;/footer&gt;&lt;script&gt;const KIND=&quot;stack&quot;;&lt;/script&gt;&lt;script&gt;&#x27;use strict&#x27;;
const key = &#x27;dsa-worksheet-v1-&#x27; + KIND;
const inputs = [...document.querySelectorAll(&#x27;[data-save]&#x27;)];
const note = document.getElementById(&#x27;saveStatus&#x27;);
function answers() { return Object.fromEntries(inputs.map(e =&gt; [e.dataset.save, e.type === &#x27;checkbox&#x27; ? e.checked : e.value])); }
function progress() { const n = inputs.filter(e =&gt; e.type === &#x27;checkbox&#x27; &amp;&amp; e.checked).length; document.getElementById(&#x27;progress&#x27;).value = n; document.getElementById(&#x27;completion&#x27;).textContent = `เสร็จแล้ว ${n}/5 ขั้นตอน`; }
try { const saved = JSON.parse(localStorage.getItem(key) || &#x27;{}&#x27;); inputs.forEach(e =&gt; { if (Object.prototype.hasOwnProperty.call(saved,e.dataset.save)) { if(e.type===&#x27;checkbox&#x27;) e.checked=!!saved[e.dataset.save]; else e.value=saved[e.dataset.save]; } }); } catch (_) { note.textContent=&#x27;ไม่สามารถอ่านข้อมูลที่บันทึกไว้ กรุณาดาวน์โหลดคำตอบก่อนปิดหน้า&#x27;; }
inputs.forEach(e =&gt; e.addEventListener(&#x27;input&#x27;, () =&gt; { progress(); try { localStorage.setItem(key,JSON.stringify(answers())); note.textContent=&#x27;บันทึกในเบราว์เซอร์แล้ว&#x27;; } catch (_) { note.textContent=&#x27;บันทึกอัตโนมัติไม่ได้ กรุณาดาวน์โหลดคำตอบ&#x27;; } }));
progress();
document.getElementById(&#x27;export&#x27;).onclick = () =&gt; { const url=URL.createObjectURL(new Blob([JSON.stringify({worksheet:KIND,version:1,exportedAt:new Date().toISOString(),answers:answers()},null,2)],{type:&#x27;application/json&#x27;})); const a=document.createElement(&#x27;a&#x27;); a.href=url; a.download=KIND+&#x27;-answers.json&#x27;; a.click(); setTimeout(()=&gt;URL.revokeObjectURL(url),1000); };
const CAP=5; let data=Array(CAP).fill(null), top=-1, front=0, rear=-1, count=0;
function render(message) { const cells=document.getElementById(&#x27;cells&#x27;); cells.replaceChildren(); data.forEach((v,i)=&gt;{ const cell=document.createElement(&#x27;div&#x27;); cell.className=&#x27;cell&#x27;; const value=document.createElement(&#x27;strong&#x27;); value.textContent=v===null?&#x27;—&#x27;:String(v); const label=document.createElement(&#x27;small&#x27;); label.textContent=&#x27;index &#x27;+i+(KIND===&#x27;stack&#x27;?(i===top?&#x27; · TOP&#x27;:&#x27;&#x27;):(count&gt;0&amp;&amp;i===front?&#x27; · FRONT&#x27;:&#x27;&#x27;)+(count&gt;0&amp;&amp;i===rear?&#x27; · REAR&#x27;:&#x27;&#x27;)); cell.append(value,label); cells.append(cell); }); document.getElementById(&#x27;state&#x27;).textContent=KIND===&#x27;stack&#x27;?`top = ${top} · จำนวน = ${top+1}`:`front = ${front} · rear = ${rear} · count = ${count}`; document.getElementById(&#x27;status&#x27;).textContent=message; }
document.getElementById(&#x27;add&#x27;).onclick=()=&gt;{ const raw=document.getElementById(&#x27;value&#x27;).value; const v=Number(raw); if(!raw.trim()||!Number.isSafeInteger(v)) return render(&#x27;กรอกจำนวนเต็มที่ถูกต้อง&#x27;); if((KIND===&#x27;stack&#x27;?top+1:count)===CAP) return render(&#x27;Overflow: เต็มแล้ว สถานะไม่เปลี่ยน&#x27;); if(KIND===&#x27;stack&#x27;) data[++top]=v; else {rear=(rear+1)%CAP;data[rear]=v;count++;} render(&#x27;เพิ่ม &#x27;+v); };
document.getElementById(&#x27;remove&#x27;).onclick=()=&gt;{ if((KIND===&#x27;stack&#x27;?top+1:count)===0) return render(&#x27;Underflow: ว่างอยู่ สถานะไม่เปลี่ยน&#x27;); let v;if(KIND===&#x27;stack&#x27;){v=data[top];data[top--]=null;}else{v=data[front];data[front]=null;front=(front+1)%CAP;count--;} render(&#x27;นำออก &#x27;+v); };
document.getElementById(&#x27;peek&#x27;).onclick=()=&gt;render((KIND===&#x27;stack&#x27;?top+1:count)===0?&#x27;ว่าง: ไม่มีข้อมูลให้ Peek&#x27;:&#x27;Peek = &#x27;+data[KIND===&#x27;stack&#x27;?top:front]+&#x27; · สถานะไม่เปลี่ยน&#x27;);
document.getElementById(&#x27;reset&#x27;).onclick=()=&gt;{data=Array(CAP).fill(null);top=-1;front=0;rear=-1;count=0;render(&#x27;เริ่มตัวจำลองใหม่แล้ว (คำตอบยังคงอยู่)&#x27;);};
render(&#x27;เริ่มจากโครงสร้างว่าง · ช่อง — หมายถึงไม่มีสมาชิกที่ใช้งาน&#x27;);
&lt;/script&gt;&lt;/main&gt;&lt;/html&gt;"></iframe><iframe title="ใบงาน queue" id="queue" hidden srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;th&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;title&gt;ใบงาน 2: Circular Queue — First In, First Out&lt;/title&gt;&lt;style&gt;*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f6fa;color:#172b45;font:17px/1.75 system-ui,sans-serif}aside{position:fixed;width:245px;height:100vh;background:#102a43;color:white;padding:30px 22px}aside a{display:block;color:#d7e8fa;text-decoration:none;padding:10px 0}main{max-width:1060px;margin-left:245px;padding:42px}header{background:#fff;border-top:6px solid #2272b9;border-radius:12px;padding:30px}h1{font-size:34px;line-height:1.3}h2{font-size:25px}section{background:white;border:1px solid #dce4ed;border-radius:12px;padding:26px;margin:24px 0;scroll-margin-top:20px}.badge{color:#1465a8;font-weight:bold}.hint{background:#eaf4ff;padding:16px;border-left:4px solid #3284c9}label{display:block;margin:14px 0}input:not([type=checkbox]),textarea{font:inherit;border:1px solid #9eb3c8;border-radius:6px;padding:9px;width:100%;background:#fff}textarea{min-height:100px}button,.button{background:#1465a8;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font:inherit;margin:4px;text-decoration:none;display:inline-block}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{border:1px solid #bdcddd;padding:10px;text-align:left}th{background:#edf4fb}pre{background:#102a43;color:#eaf4ff;padding:20px;overflow:auto;border-radius:8px;line-height:1.5}code{font-family:monospace}.cells{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.cell{border:2px solid #2774b4;border-radius:8px;padding:12px;min-width:95px;text-align:center}.cell small{display:block}#status{min-height:2em}a{color:#1465a8}progress{width:100%}@media(max-width:850px){aside{position:static;width:auto;height:auto}aside a{display:inline-block;margin-right:20px}main{margin:0;padding:18px}h1{font-size:28px}}@media print{aside,.tools,.simulator,button,.button{display:none}main{margin:0;padding:0;max-width:none}body{background:white;font-size:12pt}section{break-inside:avoid}textarea{min-height:75px}header{padding:12px}pre{white-space:pre-wrap;color:black;background:#eee}a{color:black}}&lt;/style&gt;&lt;aside&gt;&lt;strong&gt;DATA STRUCTURE LAB&lt;/strong&gt;&lt;a href=&quot;#worksheet&quot;&gt;หน้าแรก&lt;/a&gt;&lt;a href=&quot;#worksheet&quot;&gt;ใบงาน 1 · Stack&lt;/a&gt;&lt;a href=&quot;#worksheet&quot;&gt;ใบงาน 2 · Queue&lt;/a&gt;&lt;hr&gt;&lt;a href=&quot;#step1&quot;&gt;2.1 ทำนายก่อนทดลอง&lt;/a&gt;&lt;a href=&quot;#step2&quot;&gt;2.2 ติดตามสถานะทีละคำสั่ง&lt;/a&gt;&lt;a href=&quot;#step3&quot;&gt;2.3 เขียนโปรแกรม ANSI C&lt;/a&gt;&lt;a href=&quot;#step4&quot;&gt;2.4 ทดสอบขอบเขต&lt;/a&gt;&lt;a href=&quot;#step5&quot;&gt;2.5 ประยุกต์และสะท้อนผล&lt;/a&gt;&lt;/aside&gt;&lt;main&gt;&lt;header&gt;&lt;span class=&quot;badge&quot;&gt;ใบงาน 2 · 90 นาที · วิศวกรรมคอมพิวเตอร์ ปี 2&lt;/span&gt;&lt;h1&gt;Circular Queue — First In, First Out&lt;/h1&gt;&lt;p&gt;เรียนรู้ด้วยการทำนาย ทดลอง เขียนโปรแกรม และตรวจสอบผลด้วยหลักฐาน&lt;/p&gt;&lt;p&gt;สิ่งที่ใช้: คอมพิวเตอร์ และ C compiler เช่น GCC · พื้นฐาน: อาร์เรย์ ฟังก์ชัน เงื่อนไข และลูป&lt;/p&gt;&lt;p&gt;ผลลัพธ์การเรียนรู้: อธิบายลำดับข้อมูล ติดตามดัชนี พัฒนาโครงสร้างด้วยอาร์เรย์ และจัดการ Overflow/Underflow ได้&lt;/p&gt;&lt;/header&gt;&lt;section id=&quot;worksheet&quot;&gt;&lt;h2&gt;ใบงานสรุป&lt;/h2&gt;&lt;p&gt;คลิกหัวข้อเพื่อดูขั้นตอน ทำเครื่องหมายเมื่อเสร็จ และบันทึกคำตอบ คำตอบเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่ส่งให้อาจารย์อัตโนมัติ&lt;/p&gt;&lt;label&gt;ชื่อ–สกุล / รหัสนักศึกษา / กลุ่มเรียน&lt;input data-save=&quot;student&quot;&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done1&quot;&gt; &lt;a href=&quot;#step1&quot;&gt;2.1 ทำนายก่อนทดลอง&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done2&quot;&gt; &lt;a href=&quot;#step2&quot;&gt;2.2 ติดตามสถานะทีละคำสั่ง&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done3&quot;&gt; &lt;a href=&quot;#step3&quot;&gt;2.3 เขียนโปรแกรม ANSI C&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done4&quot;&gt; &lt;a href=&quot;#step4&quot;&gt;2.4 ทดสอบขอบเขต&lt;/a&gt;&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-save=&quot;done5&quot;&gt; &lt;a href=&quot;#step5&quot;&gt;2.5 ประยุกต์และสะท้อนผล&lt;/a&gt;&lt;/label&gt;&lt;progress id=&quot;progress&quot; max=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/progress&gt;&lt;span id=&quot;completion&quot;&gt;&lt;/span&gt;&lt;div class=&quot;tools&quot;&gt;&lt;button id=&quot;export&quot;&gt;ดาวน์โหลดคำตอบ (.json)&lt;/button&gt;&lt;button onclick=&quot;window.print()&quot;&gt;พิมพ์ / บันทึก PDF&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;saveStatus&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;step1&quot;&gt;&lt;h2&gt;2.1 ทำนายก่อนทดลอง · 10 นาที&lt;/h2&gt;&lt;p&gt;เปรียบเทียบกองจานกับแถวรอรับบริการ เลือกว่าสถานการณ์ใดใช้ LIFO และสถานการณ์ใดใช้ FIFO พร้อมอธิบายเหตุผล&lt;/p&gt;&lt;label&gt;ถ้าเพิ่ม 10, 20, 30 ตามลำดับ แล้วนำออกหนึ่งครั้ง จะได้ค่าใด? เพราะเหตุใด?&lt;textarea data-save=&quot;predict&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;hint&quot;&gt;เริ่ม front = 0, rear = -1, count = 0; front ชี้สมาชิกที่จะนำออก และ rear ชี้สมาชิกล่าสุด; ว่างเมื่อ count == 0; เต็มเมื่อ count == CAPACITY; เลื่อนดัชนีด้วย (index+1)%CAPACITY โดยไม่ย้ายข้อมูล เมื่อว่างค่าดัชนียังคงอยู่และต้องตรวจ count ก่อนอ่าน&lt;/div&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;section id=&quot;step2&quot;&gt;&lt;h2&gt;2.2 ติดตามสถานะ · 20 นาที&lt;/h2&gt;&lt;p&gt;ใช้ความจุ 5 ช่อง เริ่มจากโครงสร้างว่าง กรอกตารางด้วยตนเองก่อนใช้ตัวจำลอง คำสั่งที่ไม่สำเร็จต้องไม่เปลี่ยนสถานะ&lt;/p&gt;&lt;div style=&quot;overflow:auto&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;คำสั่ง&lt;/th&gt;&lt;th&gt;ค่าที่นำออก / ผลลัพธ์&lt;/th&gt;&lt;th&gt;ข้อมูลตามลำดับบริการ&lt;/th&gt;&lt;th&gt;front&lt;/th&gt;&lt;th&gt;rear&lt;/th&gt;&lt;th&gt;count&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;enqueue(10)&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(10) ค่าที่นำออก / ผลลัพธ์&quot; data-save=&quot;trace-0-0&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(10) ข้อมูลตามลำดับบริการ&quot; data-save=&quot;trace-0-1&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(10) front&quot; data-save=&quot;trace-0-2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(10) rear&quot; data-save=&quot;trace-0-3&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(10) count&quot; data-save=&quot;trace-0-4&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;enqueue(20)&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(20) ค่าที่นำออก / ผลลัพธ์&quot; data-save=&quot;trace-1-0&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(20) ข้อมูลตามลำดับบริการ&quot; data-save=&quot;trace-1-1&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(20) front&quot; data-save=&quot;trace-1-2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(20) rear&quot; data-save=&quot;trace-1-3&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(20) count&quot; data-save=&quot;trace-1-4&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;enqueue(30)&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(30) ค่าที่นำออก / ผลลัพธ์&quot; data-save=&quot;trace-2-0&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(30) ข้อมูลตามลำดับบริการ&quot; data-save=&quot;trace-2-1&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(30) front&quot; data-save=&quot;trace-2-2&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input aria-label=&quot;enqueue(30) rear&quot; data-save=&quot;trace-2-3&quot;&g }
&lt;/code&gt;&lt;/pre&gt;&lt;p&gt;คอมไพล์และรัน:&lt;/p&gt;&lt;pre&gt;gcc -std=c90 -Wall -Wextra -pedantic queue_starter.c -o queue_lab
./queue_lab&lt;/pre&gt;&lt;p&gt;บน Windows ใช้ queue_lab.exe แทนคำสั่งรันด้านบน ตัวจำลองในเว็บไม่ได้คอมไพล์หรือตรวจโค้ด C&lt;/p&gt;&lt;label&gt;วางโค้ดที่เติมแล้ว หรือระบุชื่อไฟล์ที่ส่ง&lt;textarea data-save=&quot;code&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;บันทึกผลรันจริงและอธิบายการเปลี่ยนดัชนี&lt;textarea data-save=&quot;output&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;section id=&quot;step4&quot;&gt;&lt;h2&gt;2.4 ทดสอบขอบเขต · 20 นาที&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;เรียกนำออกและ Peek ขณะว่าง สถานะต้องไม่เปลี่ยน&lt;/li&gt;&lt;li&gt;เพิ่มข้อมูลให้ครบ 5 ค่า แล้วเพิ่มครั้งที่ 6 ต้องแจ้ง Overflow&lt;/li&gt;&lt;li&gt;Peek ซ้ำสองครั้ง จำนวนสมาชิกต้องคงเดิม&lt;/li&gt;&lt;li&gt;นำข้อมูลออกจนหมดแล้วเพิ่มใหม่ โครงสร้างต้องกลับมาใช้งานได้&lt;/li&gt;&lt;li&gt;นำออก 2 ค่าจากคิวเต็ม แล้วเพิ่ม 2 ค่า ต้องใช้ช่องที่ว่างจากการวนรอบได้ โดยลำดับบริการยังเป็น FIFO&lt;/li&gt;&lt;/ol&gt;&lt;label&gt;บันทึก: กรณีทดสอบ → ผลที่คาด → ผลจริง → ผ่าน/ไม่ผ่าน&lt;textarea data-save=&quot;tests&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;พบข้อผิดพลาดใด? แก้อย่างไร? แนบผลรันก่อนและหลังแก้&lt;textarea data-save=&quot;debug&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;section id=&quot;step5&quot;&gt;&lt;h2&gt;2.5 ประยุกต์และสะท้อนผล · 10 นาที&lt;/h2&gt;&lt;label&gt;ออกแบบ ระบบคิวเครื่องพิมพ์: เก็บงาน รับงาน และบริการงานอย่างไร เมื่อคิวเต็มควรทำอย่างไร?&lt;textarea data-save=&quot;application&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;Push/Pop หรือ Enqueue/Dequeue และ Peek ใช้เวลา Big-O เท่าใด? เหตุใด? พื้นที่ของอาร์เรย์ความจุ N เป็นเท่าใด?&lt;textarea data-save=&quot;complexity&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;เปรียบเทียบ Stack กับ Queue และยกตัวอย่างงานที่ไม่เหมาะกับโครงสร้างในใบงานนี้&lt;textarea data-save=&quot;reflection&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;h3&gt;สิ่งที่ต้องส่ง&lt;/h3&gt;&lt;p&gt;ไฟล์ .c ที่เติมแล้ว ผลทดสอบพร้อมหลักฐาน และคำตอบเป็น JSON หรือ PDF (ส่งผ่านช่องทางที่ผู้สอนกำหนด)&lt;/p&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;เกณฑ์ประเมิน&lt;/th&gt;&lt;th&gt;คะแนน&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ทำนายและติดตามสถานะ&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;โปรแกรมทำงานถูกต้อง&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ทดสอบขอบเขตและอธิบายการแก้ไข&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ประยุกต์และอธิบายความซับซ้อน&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;a href=&quot;#worksheet&quot;&gt;↑ กลับไปที่ใบงาน&lt;/a&gt;&lt;/section&gt;&lt;footer&gt;โครงสร้างกิจกรรมได้รับแรงบันดาลใจจาก &lt;a href=&quot;https://arnans.github.io/iot-training/renders/activity-2.html&quot;&gt;ใบงาน IoT กิจกรรมที่ 2&lt;/a&gt; · เนื้อหาและโค้ดของใบงานนี้จัดทำขึ้นใหม่&lt;/footer&gt;&lt;script&gt;const KIND=&quot;queue&quot;;&lt;/script&gt;&lt;script&gt;&#x27;use strict&#x27;;
const key = &#x27;dsa-worksheet-v1-&#x27; + KIND;
const inputs = [...document.querySelectorAll(&#x27;[data-save]&#x27;)];
const note = document.getElementById(&#x27;saveStatus&#x27;);
function answers() { return Object.fromEntries(inputs.map(e =&gt; [e.dataset.save, e.type === &#x27;checkbox&#x27; ? e.checked : e.value])); }
function progress() { const n = inputs.filter(e =&gt; e.type === &#x27;checkbox&#x27; &amp;&amp; e.checked).length; document.getElementById(&#x27;progress&#x27;).value = n; document.getElementById(&#x27;completion&#x27;).textContent = `เสร็จแล้ว ${n}/5 ขั้นตอน`; }
try { const saved = JSON.parse(localStorage.getItem(key) || &#x27;{}&#x27;); inputs.forEach(e =&gt; { if (Object.prototype.hasOwnProperty.call(saved,e.dataset.save)) { if(e.type===&#x27;checkbox&#x27;) e.checked=!!saved[e.dataset.save]; else e.value=saved[e.dataset.save]; } }); } catch (_) { note.textContent=&#x27;ไม่สามารถอ่านข้อมูลที่บันทึกไว้ กรุณาดาวน์โหลดคำตอบก่อนปิดหน้า&#x27;; }
inputs.forEach(e =&gt; e.addEventListener(&#x27;input&#x27;, () =&gt; { progress(); try { localStorage.setItem(key,JSON.stringify(answers())); note.textContent=&#x27;บันทึกในเบราว์เซอร์แล้ว&#x27;; } catch (_) { note.textContent=&#x27;บันทึกอัตโนมัติไม่ได้ กรุณาดาวน์โหลดคำตอบ&#x27;; } }));
progress();
document.getElementById(&#x27;export&#x27;).onclick = () =&gt; { const url=URL.createObjectURL(new Blob([JSON.stringify({worksheet:KIND,version:1,exportedAt:new Date().toISOString(),answers:answers()},null,2)],{type:&#x27;application/json&#x27;})); const a=document.createElement(&#x27;a&#x27;); a.href=url; a.download=KIND+&#x27;-answers.json&#x27;; a.click(); setTimeout(()=&gt;URL.revokeObjectURL(url),1000); };
const CAP=5; let data=Array(CAP).fill(null), top=-1, front=0, rear=-1, count=0;
function render(message) { const cells=document.getElementById(&#x27;cells&#x27;); cells.replaceChildren(); data.forEach((v,i)=&gt;{ const cell=document.createElement(&#x27;div&#x27;); cell.className=&#x27;cell&#x27;; const value=document.createElement(&#x27;strong&#x27;); value.textContent=v===null?&#x27;—&#x27;:String(v); const label=document.createElement(&#x27;small&#x27;); label.textContent=&#x27;index &#x27;+i+(KIND===&#x27;stack&#x27;?(i===top?&#x27; · TOP&#x27;:&#x27;&#x27;):(count&gt;0&amp;&amp;i===front?&#x27; · FRONT&#x27;:&#x27;&#x27;)+(count&gt;0&amp;&amp;i===rear?&#x27; · REAR&#x27;:&#x27;&#x27;)); cell.append(value,label); cells.append(cell); }); document.getElementById(&#x27;state&#x27;).textContent=KIND===&#x27;stack&#x27;?`top = ${top} · จำนวน = ${top+1}`:`front = ${front} · rear = ${rear} · count = ${count}`; document.getElementById(&#x27;status&#x27;).textContent=message; }
document.getElementById(&#x27;add&#x27;).onclick=()=&gt;{ const raw=document.getElementById(&#x27;value&#x27;).value; const v=Number(raw); if(!raw.trim()||!Number.isSafeInteger(v)) return render(&#x27;กรอกจำนวนเต็มที่ถูกต้อง&#x27;); if((KIND===&#x27;stack&#x27;?top+1:count)===CAP) return render(&#x27;Overflow: เต็มแล้ว สถานะไม่เปลี่ยน&#x27;); if(KIND===&#x27;stack&#x27;) data[++top]=v; else {rear=(rear+1)%CAP;data[rear]=v;count++;} render(&#x27;เพิ่ม &#x27;+v); };
document.getElementById(&#x27;remove&#x27;).onclick=()=&gt;{ if((KIND===&#x27;stack&#x27;?top+1:count)===0) return render(&#x27;Underflow: ว่างอยู่ สถานะไม่เปลี่ยน&#x27;); let v;if(KIND===&#x27;stack&#x27;){v=data[top];data[top--]=null;}else{v=data[front];data[front]=null;front=(front+1)%CAP;count--;} render(&#x27;นำออก &#x27;+v); };
document.getElementById(&#x27;peek&#x27;).onclick=()=&gt;render((KIND===&#x27;stack&#x27;?top+1:count)===0?&#x27;ว่าง: ไม่มีข้อมูลให้ Peek&#x27;:&#x27;Peek = &#x27;+data[KIND===&#x27;stack&#x27;?top:front]+&#x27; · สถานะไม่เปลี่ยน&#x27;);
document.getElementById(&#x27;reset&#x27;).onclick=()=&gt;{data=Array(CAP).fill(null);top=-1;front=0;rear=-1;count=0;render(&#x27;เริ่มตัวจำลองใหม่แล้ว (คำตอบยังคงอยู่)&#x27;);};
render(&#x27;เริ่มจากโครงสร้างว่าง · ช่อง — หมายถึงไม่มีสมาชิกที่ใช้งาน&#x27;);
&lt;/script&gt;&lt;/main&gt;&lt;/html&gt;"></iframe><script>function show(k){for(const n of ['stack','queue']){document.getElementById(n).hidden=n!==k;document.getElementById('tab-'+n).setAttribute('aria-pressed',String(n===k));}}</script></body></html>
